<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com data: blob:;" />
  <title>เข้าสู่ระบบ — ระบบบริหารจัดการครุภัณฑ์ กองบริหารงานกลาง มช.</title>
  <meta name="description" content="ระบบบริหารจัดการและติดตามครุภัณฑ์ กองบริหารงานกลาง สำนักงานมหาวิทยาลัย มหาวิทยาลัยเชียงใหม่" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=5" />
  <script src="js/theme.js?v=5"></script>
</head>
<body class="login-page">
  

  <!-- Background Pattern -->
  <div class="login-bg">
    <div class="login-bg-gradient"></div>
    <div class="login-bg-pattern"></div>
  </div>

  <!-- Login Card -->
  <main class="login-container">
    <div class="login-card" role="main">

      <!-- Logo & Title -->
      <div class="login-header">
        <div class="login-logo-wrap">
          <img src="assets/images/cmu_logo1.jpg" alt="ตราสัญลักษณ์มหาวิทยาลัยเชียงใหม่" class="login-logo" />
        </div>
        <div class="login-title-group" style="text-align: center; margin-top: 0.75rem;">
          <h1 class="login-title" style="font-weight: 800; font-size: 1.8rem; letter-spacing: -0.02em; margin-bottom: 0.25rem;">
            <span style="color: var(--cmu-purple);">SmartCAD</span><span style="color: var(--cmu-gold);">-Inventory</span>
          </h1>
          <h2 style="font-size: 1.05rem; color: var(--text-secondary); font-weight: 600; margin-bottom: 0.25rem; letter-spacing: 0.01em;">
            ระบบบริหารจัดการครุภัณฑ์
          </h2>
          <p class="login-subtitle" style="font-size: 0.95rem; color: var(--cmu-gold); font-weight: 700;">
            (กองบริหารงานกลาง สำนักงานมหาวิทยาลัย)
          </p>
        </div>
      </div>

      <div class="login-divider"></div>

      <!-- Form -->
      <form id="loginForm" class="login-form" novalidate>
        <div id="loginAlert" class="login-alert hidden" role="alert" aria-live="polite"></div>

        <div class="form-group">
          <label for="email" class="form-label">อีเมล</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            </span>
            <input
              id="email"
              name="email"
              type="email"
              class="form-input"
              placeholder="กรอกอีเมลของคุณ"
              autocomplete="email"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">รหัสผ่าน</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input
              id="password"
              name="password"
              type="password"
              class="form-input"
              placeholder="กรอกรหัสผ่าน"
              autocomplete="current-password"
              required
            />
            <button type="button" id="togglePassword" class="input-toggle" aria-label="แสดง/ซ่อนรหัสผ่าน">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button id="loginBtn" type="submit" class="btn-login">
          <span id="loginBtnText">เข้าสู่ระบบ</span>
          <span id="loginBtnSpinner" class="btn-spinner hidden" aria-hidden="true"></span>
        </button>
      </form>

      <p class="login-footer-text">
        หากมีปัญหาการเข้าสู่ระบบ กรุณาติดต่อผู้ดูแลระบบ
      </p>
    </div>

    <!-- Version badge -->
    <p class="login-version">ระบบ CAD Inventory v1.0 · พ.ศ. 2568</p>
  </main>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=8"></script>
  <script src="js/auth.js?v=8"></script>
  <script>
    // ============================================================
    // Login Page Logic
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('loginForm');
      const alert = document.getElementById('loginAlert');
      const loginBtn = document.getElementById('loginBtn');
      const loginBtnText = document.getElementById('loginBtnText');
      const loginBtnSpinner = document.getElementById('loginBtnSpinner');
      const togglePassword = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');

      // 1. ตรวจสอบ Session แบบ Asynchronous โดยไม่บล็อก UI
      getSession().then(session => {
        if (session) {
          window.location.href = 'dashboard.html';
        }
      }).catch(err => {
        console.error("Session check failed:", err);
      });

      // Toggle password visibility
      togglePassword.addEventListener('click', () => {
        const isHidden = passwordInput.type === 'password';
        passwordInput.type = isHidden ? 'text' : 'password';
        eyeIcon.innerHTML = isHidden
          ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
          : `<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>`;
      });

      // Form submit
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value.trim().toLowerCase();
        const password = document.getElementById('password').value;

        if (!email || !password) {
          showAlert('กรุณากรอกอีเมลและรหัสผ่าน', 'error');
          return;
        }

        setLoading(true);
        hideAlert();

        const { error } = await signIn(email, password);

        if (error) {
          setLoading(false);
          showAlert(getThaiErrorMessage(error.message), 'error');
          return;
        }

        // Login success — redirect
        window.location.href = 'dashboard.html';
      });

      function showAlert(message, type = 'error') {
        alert.textContent = message;
        alert.className = `login-alert alert-${type}`;
      }

      function hideAlert() {
        alert.className = 'login-alert hidden';
      }

      function setLoading(loading) {
        loginBtn.disabled = loading;
        loginBtnText.textContent = loading ? 'กำลังเข้าสู่ระบบ...' : 'เข้าสู่ระบบ';
        loginBtnSpinner.classList.toggle('hidden', !loading);
      }

      function getThaiErrorMessage(msg) {
        if (!msg) return 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง';
        if (msg.includes('Invalid login credentials')) return 'อีเมลหรือรหัสผ่านไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง';
        if (msg.includes('Email not confirmed')) return 'บัญชีนี้ยังไม่ได้รับการยืนยันอีเมล กรุณาติดต่อผู้ดูแลระบบ';
        if (msg.includes('User not found')) return 'ไม่พบบัญชีผู้ใช้งานนี้ในระบบ';
        if (msg.includes('Too many requests')) return 'มีการพยายามเข้าสู่ระบบถี่เกินไป กรุณารอสักครู่แล้วลองใหม่';
        if (msg.includes('Database error querying schema')) return 'ไม่พบข้อมูลบัญชีหรืออีเมลนี้ในระบบ (กรุณาตรวจสอบการสะกดอีเมล)';
        return msg;
      }
    });
  </script>
</body>
</html>
